name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win -- --publish never
      - run: node scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: OpenJob-Radar-Windows
          path: |
            dist/*Setup.exe
            dist/windows-desktop-smoke.png
          if-no-files-found: error
          # Installers and PNGs are already compressed.
          compression-level: 0
          # Keep published-branch installers available; PR builds are temporary.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
