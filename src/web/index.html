<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>OpenJob Radar · 로컬 검토실</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL · REVIEW FIRST</p>
        <h1>OpenJob Radar</h1>
        <p class="subtitle">수집부터 승인까지, 내 컴퓨터에서만 확인하세요.</p>
      </div>
      <div class="local-badge"><span></span>127.0.0.1 로컬 실행</div>
    </header>

    <main>
      <section class="summary" aria-label="현재 상태">
        <article><span>등록 검토</span><strong id="ready-count">-</strong></article>
        <article><span>확인 필요</span><strong id="review-count">-</strong></article>
        <article><span>승인 기록</span><strong id="approved-count">-</strong></article>
        <article><span>제외 기록</span><strong id="rejected-count">-</strong></article>
      </section>

      <section class="collector panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MANUAL COLLECTION</p>
            <h2>새 공고 수집</h2>
          </div>
          <p id="last-run">최근 실행 기록 없음</p>
        </div>
        <div class="source-list" role="group" aria-label="수집 출처">
          <label><input type="checkbox" name="source" value="worldjob" checked /><span>월드잡플러스</span></label>
          <label><input type="checkbox" name="source" value="culture" checked /><span>재외한국문화원</span></label>
          <label><input type="checkbox" name="source" value="kotra" checked /><span>KOTRA</span></label>
        </div>
        <div class="collector-actions">
          <label class="dry-run"><input id="dry-run" type="checkbox" /> 파일을 바꾸지 않고 미리보기</label>
          <button id="collect" class="primary" type="button">선택 출처 수집</button>
        </div>
      </section>

      <section class="workspace panel">
        <div class="section-heading queue-heading">
          <div>
            <p class="eyebrow">REVIEW QUEUE</p>
            <h2>수집 결과 검토</h2>
          </div>
          <button id="refresh" class="ghost" type="button">새로고침</button>
        </div>
        <div class="tabs" role="tablist" aria-label="검토 목록">
          <button class="tab active" role="tab" aria-selected="true" data-tab="ready">등록 검토 <span id="ready-tab-count">0</span></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="needsReview">확인 필요 <span id="review-tab-count">0</span></button>
        </div>
        <div id="queue" class="queue" aria-live="polite"></div>
        <div class="bulk-actions">
          <span id="selected-count">0건 선택</span>
          <div>
            <button id="reject" class="danger" type="button" disabled>선택 제외</button>
            <button id="approve" class="primary" type="button" disabled>선택 승인</button>
          </div>
        </div>
      </section>

      <section id="notice" class="notice" aria-live="assertive" hidden></section>
    </main>
  </body>
</html>
